document.querySelectorAll('.class-opt').forEach(el=>{el.onclick=()=>{document.querySelectorAll('.class-opt').forEach(c=>c.classList.remove('active'));el.classList.add('active');S.armorColor=parseInt(el.dataset.color,16);S.armorMetal=parseFloat(el.dataset.metal);S.armorRough=parseFloat(el.dataset.rough);S.classLabel=el.dataset.label;applyCharacterArmor();};});

// ===== RENDER PROFISSIONAL - GTA LEVEL =====
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.12,600);

const sky=new Sky(); sky.scale.setScalar(6000); scene.add(sky);

const sun=new THREE.DirectionalLight(0xfff0dd,4.5); sun.position.set(-95,115,70); sun.castShadow=true; sun.shadow.mapSize.set(4096,4096); sun.shadow.camera.near=10; sun.shadow.camera.far=340; const d=145; sun.shadow.camera.left=-d; sun.shadow.camera.right=d; sun.shadow.camera.top=d; sun.shadow.camera.bottom=-d; sun.shadow.bias=-0.00015; sun.shadow.normalBias=0.03; sun.shadow.radius=4; scene.add(sun);

// ===== TEXTURAS 4K COM RELEVO - PROFISSIONAL =====
function makeNoiseTexture(base, spots, size=1024){
  const c=document.createElement('canvas'); c.width=c.height=size; const ctx=c.getContext('2d'); ctx.fillStyle=base; ctx.fillRect(0,0,size,size);
  for(let i=0;i<spots;i++){ const x=Math.random()*size,y=Math.random()*size,r=1+Math.random()*6; ctx.fillStyle=`rgba(${Math.random()>0.5?255:0},${Math.random()>0.5?255:0},${Math.random()>0.5?255:0},0.06)`; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; return t;
}
function createTexture(type,repeat){
  const size=1024; const c=document.createElement('canvas'); c.width=c.height=size; const ctx=c.getContext('2d');
  if(type==='stone'){ ctx.fillStyle='#4a443d'; ctx.fillRect(0,0,size,size); const rows=12,rowH=size/rows; for(let r=0;r<rows;r++){ let x=(r%2)*-32; while(x<size){ const bw=48+Math.random()*42; const v=100+Math.random()*70; ctx.fillStyle=`rgb(${v},${v-7},${v-16})`; ctx.fillRect(x+3,r*rowH+3,bw-6,rowH-6); ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(x,r*rowH,bw,2); x+=bw; } } for(let i=0;i<6000;i++){ ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(Math.random()*size,Math.random()*size,2,2); } }
  else if(type==='plaster'){ ctx.fillStyle='#d8cbb0'; ctx.fillRect(0,0,size,size); for(let i=0;i<12000;i++){ const x=Math.random()*size,y=Math.random()*size,r=1+Math.random()*7; ctx.fillStyle=Math.random()>0.5?'rgba(120,105,80,0.12)':'rgba(255,245,230,0.12)'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); } }
  else if(type==='wood'){ ctx.fillStyle='#4a3220'; ctx.fillRect(0,0,size,size); for(let y=0;y<size;y+=1.2){ const v=45+Math.sin(y*0.12)*20+(Math.random()-0.5)*18; ctx.fillStyle=`rgb(${v+30},${v+12},${v-4})`; ctx.fillRect(0,y,size,1.6); } for(let i=0;i<40;i++){ ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(Math.random()*size,0,2,size); } }
  else if(type==='roof'){ ctx.fillStyle='#6e3522'; ctx.fillRect(0,0,size,size); for(let r=0;r<14;r++){ const y=r*(size/14); for(let col=0;col<12;col++){ const x=col*(size/12)+(r%2)*18; const t=100+Math.random()*50; ctx.fillStyle=`rgb(${t+40},${t*0.45},${t*0.32})`; ctx.beginPath(); ctx.arc(x,y+16,20,0,Math.PI); ctx.fill(); ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x-20,y+14,40,3); } } }
  else if(type==='ground'){ ctx.fillStyle='#3a4f2a'; ctx.fillRect(0,0,size,size); for(let i=0;i<45000;i++){ const x=Math.random()*size,y=Math.random()*size,s=1+Math.random()*3; const rnd=Math.random(); let col=rnd<0.3?'#2a3c1a':(rnd<0.6?'#4a6a2e':(rnd<0.8?'#5d7340':'#5c4a32')); ctx.fillStyle=col; ctx.fillRect(x,y,s,s); } }
  else if(type==='cobble'){ ctx.fillStyle='#3f3a33'; ctx.fillRect(0,0,size,size); for(let i=0;i<500;i++){ const x=Math.random()*size,y=Math.random()*size,rad=9+Math.random()*15; const g=110+Math.random()*60; ctx.fillStyle=`rgb(${g},${g-6},${g-14})`; ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.arc(x-rad*0.3,y-rad*0.3,rad*0.4,0,Math.PI*2); ctx.fill(); } }
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(repeat,repeat); tex.anisotropy=16; tex.colorSpace=THREE.SRGBColorSpace; return tex;

const groundTex=createTexture('ground',85); const cobbleTex=createTexture('cobble',32);
const stoneMat=new THREE.MeshStandardMaterial({map:createTexture('stone',4.2),roughness:0.85,metalness:0.05,envMapIntensity:0.4});

for(let i=0;i<52;i++){ const ang=(i/52)*Math.PI*2; const dist=280+(i%4)*40; const r=58+(i%5)*20; const h=34+(i%6)*14; const hill=new THREE.Mesh(new THREE.ConeGeometry(r,h,12),hillMat); hill.position.set(Math.cos(ang)*dist,h*0.4,Math.sin(ang)*dist); scene.add(hill); }
