<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Riverwood</title>
<style>
*{margin:0;box-sizing:border-box;font-family:system-ui;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a2f1a;touch-action:none}
#game{position:fixed;inset:0;display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:none;justify-content:space-between;z-index:60}
.panel{background:rgba(0,0,0,.85);padding:10px 14px;border:1px solid #dab676;border-radius:12px;color:#fff}
#controls{position:fixed;bottom:14px;left:0;right:0;display:none;justify-content:space-between;padding:0 14px;z-index:70;align-items:flex-end}
#stick{width:150px;height:150px;border:3px solid #fff;border-radius:50%;background:rgba(0,0,0,.4);position:relative}
#nub{position:absolute;width:60px;height:60px;left:42px;top:42px;border-radius:50%;background:#f0e6d2}
#btns{display:grid;grid-template-columns:repeat(3,68px);gap:10px}
.btn{width:68px;height:68px;border-radius:50%;background:#222;color:#fff;font-weight:800;border:2px solid #fff}
#btnHit{width:78px;height:78px;background:#8c3a22;grid-column:3;grid-row:2}
#btnHeavy{background:#542850;grid-column:3;grid-row:1}
#btnMagic{background:#1d4054;grid-column:2;grid-row:1}
#btnJump{background:#2d543e;grid-column:2;grid-row:2}
#btnRoll{background:#253e54;grid-column:1;grid-row:2}
#btnLock{background:#423d21;grid-column:1;grid-row:1}
#login{position:fixed;inset:0;z-index:100;background:#121a14;display:grid;place-items:center;padding:18px}
#card{width:100%;max-width:400px;background:#1a1a1a;border:1px solid #dab676;border-radius:18px;padding:24px;color:#fff;text-align:center}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #dab676;background:#000;color:#fff;margin:12px 0;font-size:16px}
button.enter{width:100%;padding:15px;border-radius:10px;background:#deb066;font-weight:900;border:0;font-size:16px}
#bar{height:6px;background:#000;border-radius:3px;margin-top:12px;overflow:hidden}
#fill{height:100%;width:0%;background:#e8ca8e}
#loadtext{font-size:12px;color:#aaa;margin-top:6px}
#fb{position:fixed;top:110px;left:50%;transform:translateX(-50%);z-index:80;background:#ffcc00;color:#000;padding:8px 18px;border-radius:20px;font-weight:900;display:none}
.bar{width:140px;height:8px;background:#000;border-radius:4px;margin-top:5px;overflow:hidden}
#hp{height:100%;width:100%;background:#e05a47}
#stam{height:100%;width:100%;background:#52b788}
</style>
<script>function animar(){var p=0;var t=setInterval(function(){p+=20;if(p>100)p=100;var f=document.getElementById('fill');if(f)f.style.width=p+'%';var tx=document.getElementById('loadtext');if(tx)tx.textContent=p>=100?'Pronto! Clica em ENTRAR':'Carregando... '+p+'%';if(p>=100)clearInterval(t);},200);}</script>
</head>
<body onload="animar()">
<canvas id="game"></canvas>
<div id="fb"></div>
<div id="hud"><div class="panel"><div id="nome" style="color:#f0d7a3;font-weight:700">LUCAS</div><div class="bar"><div id="hp"></div></div><div class="bar" style="height:5px"><div id="stam"></div></div><div id="clima" style="font-size:11px">Dia - Riverwood</div></div><div class="panel" id="xp">Nv.1</div></div>
<div id="controls"><div id="stick"><div id="nub"></div></div><div id="btns"><button class="btn" id="btnLock">MIRA</button><button class="btn" id="btnMagic">MAGIA</button><button class="btn" id="btnHeavy">FORTE</button><button class="btn" id="btnRoll">ESQUIVA</button><button class="btn" id="btnJump">PULAR</button><button class="btn" id="btnHit">GOLPE</button></div></div>
<div id="login"><div id="card"><div style="color:#b89a64;font-size:11px">ONLINE - RIVERWOOD</div><h1 style="color:#f0d7a3;margin:8px 0">Riverwood</h1><input id="playerName" value="Lucas"><button class="enter" onclick="entrar()">ENTRAR NO JOGO</button><div id="bar"><div id="fill"></div></div><div id="loadtext">Carregando... 0%</div></div></div>
<script>
var cv=document.getElementById('game'),ctx=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;} rs(); addEventListener('resize',rs);
function fb(t){var e=document.getElementById('fb');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},700);}
var S={hp:160,maxHp:160,stam:110,maxStam:110,exp:0,level:1,next:100,x:0,y:120,logged:false,dir:0,anim:0,atk:0,roll:0};
var joy={x:0,y:0,on:false},cam={x:0,y:120},en=[],sp=[];
var casas=[[-180,-80],[180,-80],[-220,-320],[-90,-320],[90,-320],[220,-320],[-330,140],[330,140],[-120,160],[120,160],[0,380]];
var arv=[]; for(var i=0;i<70;i++){var a=i/70*6.28,d=650+Math.random()*400;arv.push({x:Math.cos(a)*d,y:Math.sin(a)*d});}
for(var i=0;i<20;i++)arv.push({x:(Math.random()-0.5)*500,y:(Math.random()-0.5)*500});
function spawn(x,y){en.push({x:x,y:y,hp:200,maxHp:200,alive:true});}
spawn(220,-40);spawn(-220,-40);spawn(0,-380);
function entrar(){var n=document.getElementById('playerName').value||'Lucas';document.getElementById('nome').textContent=n.toUpperCase();document.getElementById('login').style.display='none';document.getElementById('hud').style.display='flex';document.getElementById('controls').style.display='flex';S.logged=true;fb('ENTROU! Testa o GOLPE');}
var stick=document.getElementById('stick'),nub=document.getElementById('nub');
function gp(e){if(e.touches&&e.touches[0])return{x:e.touches[0].clientX,y:e.touches[0].clientY};return{x:e.clientX,y:e.clientY};}
function mv(e){var p=gp(e),r=stick.getBoundingClientRect(),dx=p.x-(r.left+75),dy=p.y-(r.top+75),m=48,l=Math.hypot(dx,dy);if(l>m){dx=dx/l*m;dy=dy/l*m;}joy.x=dx/m;joy.y=dy/m;nub.style.left=(42+dx)+'px';nub.style.top=(42+dy)+'px';}
function st(e){e.preventDefault();joy.on=true;mv(e);} function ed(e){e.preventDefault();joy.on=false;joy.x=0;joy.y=0;nub.style.left='42px';nub.style.top='42px';}
stick.addEventListener('touchstart',st,{passive:false}); stick.addEventListener('touchmove',function(e){if(joy.on){e.preventDefault();mv(e);}}, {passive:false}); stick.addEventListener('touchend',ed,{passive:false});
stick.addEventListener('mousedown',function(e){joy.on=true;mv(e);}); addEventListener('mousemove',function(e){if(joy.on)mv(e);}); addEventListener('mouseup',function(){if(joy.on)ed({preventDefault:function(){}});});
function bind(id,fn){var el=document.getElementById(id);el.addEventListener('touchstart',function(e){e.preventDefault();fn();},{passive:false});el.addEventListener('click',function(e){e.preventDefault();fn();});}
function atk(h){if(!S.logged||S.atk>0)return;S.atk=0.35;fb(h?'GOLPE FORTE!':'GOLPE!');for(var i=0;i<en.length;i++){var e=en[i];if(e.alive&&Math.hypot(e.x-S.x,e.y-S.y)<80){e.hp-=h?95:48;if(e.hp<=0){e.alive=false;S.exp+=85;if(S.exp>=S.next){S.exp-=S.next;S.level++;S.next=Math.floor(S.next*1.4);S.maxHp+=32;S.hp=S.maxHp;fb('SUBIU DE NIVEL!');}}}}}
bind('btnHit',function(){atk(false);}); bind('btnHeavy',function(){atk(true);});
bind('btnMagic',function(){if(S.stam<25){fb('SEM STAMINA!');return;}S.stam-=25;fb('MAGIA!');sp.push({x:S.x,y:S.y,vx:Math.cos(S.dir)*10,vy:Math.sin(S.dir)*10,life:1.5});});
bind('btnJump',function(){fb('PULOU!');S.roll=0.3;});
bind('btnRoll',function(){if(S.stam>=18){S.stam-=18;S.roll=0.4;fb('ESQUIVA!');}});
bind('btnLock',function(){var b=null,d=250;for(var i=0;i<en.length;i++){var e=en[i];if(e.alive){var dd=Math.hypot(e.x-S.x,e.y-S.y);if(dd<d){d=dd;b=e;}}}S.locked=b;fb(b?'MIRA TRAVADA!':'NENHUM INIMIGO');});
function loop(){requestAnimationFrame(loop);var dt=0.016;
if(S.logged){var ix=joy.x,iy=joy.y,l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l;l=1;}var v=S.roll>0?320:l>0.8?210:120;S.x+=ix*v*dt;S.y+=iy*v*dt;if(l>0.1){S.dir=Math.atan2(iy,ix);S.anim+=dt*2;}S.stam=Math.min(S.maxStam,S.stam+20*dt);S.atk=Math.max(0,S.atk-dt);S.roll=Math.max(0,S.roll-dt);cam.x+=(S.x-cam.x)*0.12;cam.y+=(S.y-cam.y)*0.12;
for(var i=0;i<en.length;i++){var e=en[i];if(!e.alive)continue;var d=Math.hypot(S.x-e.x,S.y-e.y);if(d<280&&d>35){e.x+=(S.x-e.x)/d*55*dt;e.y+=(S.y-e.y)/d*55*dt;}if(d<40)S.hp=Math.max(0,S.hp-12*dt);}
for(var i=sp.length-1;i>=0;i--){var s=sp[i];s.life-=dt;s.x+=s.vx;s.y+=s.vy;for(var j=0;j<en.length;j++){var e2=en[j];if(e2.alive&&Math.hypot(s.x-e2.x,s.y-e2.y)<28){e2.hp-=72;sp.splice(i,1);if(e2.hp<=0)e2.alive=false;break;}}if(s.life<=0&&sp[i])sp.splice(i,1);}
document.getElementById('hp').style.width=(S.hp/S.maxHp*100)+'%';document.getElementById('stam').style.width=(S.stam/S.maxStam*100)+'%';document.getElementById('xp').textContent='Nv.'+S.level+' - '+S.exp+'/'+S.next;document.getElementById('clima').textContent='Dia - '+(Math.abs(S.x)<250&&Math.abs(S.y)<250?'Riverwood':S.y<-250?'Floresta':S.y>250?'Planicie':S.x>250?'Montanhas':'Costa');}
var sx=-cam.x,sy=-cam.y,cx=cv.width/2,cy=cv.height/2;
ctx.fillStyle='#3d5a2a';ctx.fillRect(0,0,cv.width,cv.height);
ctx.fillStyle='#5a534a';ctx.fillRect(cx-35+sx,-1000+sy,70,3000);ctx.fillRect(-1000+sx,cy-30+sy,3000,60);
ctx.fillStyle='#2a7a9a';ctx.fillRect(-1000+sx,560+sy,3000,90);ctx.fillStyle='#8a6d4a';ctx.fillRect(cx-45+sx,555+sy,90,100);
ctx.fillStyle='#6a635a';ctx.beginPath();ctx.arc(cx+sx,cy+sy,130,0,7);ctx.fill();
for(var i=0;i<casas.length;i++){var h=casas[i],x=h[0]+sx+cx,y=h[1]+sy+cy;if(x<-120||x>cv.width+120||y<-120||y>cv.height+120)continue;ctx.fillStyle='#e2d3b5';ctx.fillRect(x-45,y-35,90,70);ctx.fillStyle='#7a3522';ctx.beginPath();ctx.moveTo(x-55,y-35);ctx.lineTo(x,y-75);ctx.lineTo(x+55,y-35);ctx.closePath();ctx.fill();ctx.fillStyle='#4a3220';ctx.fillRect(x-10,y+5,20,30);ctx.fillStyle='#ffc65a';ctx.fillRect(x-32,y-10,16,16);ctx.fillRect(x+16,y-10,16,16);}
ctx.fillStyle='#6a635a';ctx.beginPath();ctx.arc(cx+sx,cy+sy,18,0,7);ctx.fill();
ctx.fillStyle='#ff6b00';ctx.beginPath();ctx.arc(cx+sx,cy-70+sy,10,0,7);ctx.fill();
for(var i=0;i<arv.length;i++){var t=arv[i],x=t.x+sx+cx,y=t.y+sy+cy;if(x<-60||x>cv.width+60||y<-80||y>cv.height+80)continue;ctx.fillStyle='#4a3220';ctx.fillRect(x-5,y-5,10,28);ctx.fillStyle='#2a521c';ctx.beginPath();ctx.arc(x,y-22,22,0,7);ctx.fill();ctx.fillStyle='#3a6e2a';ctx.beginPath();ctx.arc(x,y-34,16,0,7);ctx.fill();}
for(var i=0;i<en.length;i++){var e=en[i];if(!e.alive)continue;var x=e.x+sx+cx,y=e.y+sy+cy;ctx.fillStyle='#5a1a1a';ctx.fillRect(x-12,y-10,24,28);ctx.fillStyle='#1a1a1a';ctx.fillRect(x-9,y-28,18,18);ctx.fillStyle='#000';ctx.fillRect(x-18,y-44,36,6);ctx.fillStyle='#e63946';ctx.fillRect(x-18,y-44,36*(e.hp/e.maxHp),6);}
if(S.logged){var x=cx,y=cy,b=Math.sin(S.anim*18)*2;ctx.fillStyle='#8c1a1a';ctx.beginPath();ctx.moveTo(x-14,y-6+b);ctx.lineTo(x+14,y-6+b);ctx.lineTo(x+18,y+18);ctx.lineTo(x-18,y+18);ctx.closePath();ctx.fill();ctx.fillStyle='#1a1a1c';ctx.fillRect(x-10,y+8,8,14);ctx.fillRect(x+2,y+8,8,14);ctx.fillStyle='#2c3540';ctx.fillRect(x-14,y-8+b,28,22);ctx.fillStyle='#e8c9a0';ctx.fillRect(x-9,y-24+b,18,16);ctx.fillStyle='#2c3540';ctx.fillRect(x-10,y-30+b,20,12);ctx.fillStyle='#c1121f';ctx.beginPath();ctx.moveTo(x-2,y-32+b);ctx.lineTo(x+2,y-32+b);ctx.lineTo(x,y-40+b);ctx.closePath();ctx.fill();ctx.fillStyle='#f0f4f8';ctx.fillRect(x+18,y-10,4,28);ctx.fillStyle='#2c3540';ctx.beginPath();ctx.arc(x-22,y+4,10,0,7);ctx.fill();if(S.locked&&S.locked.alive){ctx.strokeStyle='#ff595e';ctx.beginPath();ctx.arc(S.locked.x+sx+cx,S.locked.y+sy+cy,20,0,7);ctx.stroke();}}
else{ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillText('Riverwood - Faça login',cv.width/2,120);}
for(var i=0;i<sp.length;i++){var s=sp[i];ctx.fillStyle='#4cc9f0';ctx.beginPath();ctx.arc(s.x+sx+cx,s.y+sy+cy,8,0,7);ctx.fill();}
}
loop();
</script>
</body>
</html>
